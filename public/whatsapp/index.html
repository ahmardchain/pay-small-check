<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatsApp · Pay Small Check</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap page stack">
      <p class="kicker"><a href="/">Pay Small Check</a></p>
      <h1>WhatsApp is coming later</h1>
      <p>Version 1 checks X only. A later version can accept a phone number or text you paste from a chat. It will say so on the receipt. It will not call a fake WhatsApp source.</p>
      <form class="card stack">
        <label>
          Number or pasted chat
          <input id="wa" placeholder="Nothing here is sent" disabled />
        </label>
        <button class="primary" type="button" disabled>Coming soon</button>
      </form>
      <p>Instagram is a later phase as well.</p>
    </main>
  </body>
</html>
